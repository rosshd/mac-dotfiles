# no-mistakes global configuration

# Keep no-mistakes deterministic when launched from git hooks, daemons,
# Shortcuts SSH, or other shells with a reduced PATH.
agent: codex

agent_path_override:
  claude: /opt/homebrew/bin/claude
  codex: /opt/homebrew/bin/codex
  opencode: /opt/homebrew/bin/opencode

ci_timeout: "4h"
log_level: info

auto_fix:
  rebase: 3
  lint: 3
  test: 3
  review: 0
  document: 3
  ci: 3

intent:
  enabled: true
  threshold: 0.2
  slack_days: 3
